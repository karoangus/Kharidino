<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="خریدینو — اپلیکیشن مدیریت لیست خرید؛ خریدت رو ساده کن." />
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="خریدینو" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/apple-180.png" />
    <title>خریدینو — خریدت رو ساده کن</title>
    <script>
      // اعمال تم ذخیره‌شده پیش از رندر (جلوگیری از جرقهٔ رنگ)
      try {
        var s = JSON.parse(localStorage.getItem('kharidino.v1'));
        var t = s && s.settings && s.settings.theme;
        if (t === 'light' || t === 'dark' || t === 'neon' || t === 'amoled') {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
