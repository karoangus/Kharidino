name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production bundle
        run: PAGES_BASE=/Kharidino/ npm run build
      - run: npm test

      # الف) استقرار از طریق Actions (در صورتی که Pages در حالت Actions باشد)
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

      # ب) استقرار به شاخه gh-pages (در صورتی که Pages در حالت branch/gh-pages باشد)
      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      # ج) از آن‌جا که در حال حاضر Pages در حالت legacy (source=branch, main, /)
      # تنظیم شده و GITHUB_TOKEN دسترسی تغییر تنظیمات را ندارد، خروجی build را
      # در قالب یک commit مستقل (با [skip ci] برای جلوگیری از حلقهٔ بی‌نهایت)
      # روی شاخهٔ main منتشر می‌کنیم. برای اینکه فایل‌های سورس overwrite نشوند،
      # در یک کلون جداگانه کار می‌کنیم و فقط فایل‌های build را add می‌کنیم.
      - name: Publish built output to main root (legacy Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # کلون جداگانه از main تا فایل‌های build را بدون دست‌زدن به سورس اضافه کنیم
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages-deploy \
            --branch main --depth 5
          cd /tmp/pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # کپی خروجی build از workspace به ریشهٔ این کلون
          cp -f "$GITHUB_WORKSPACE"/dist/index.html ./index.html
          cp -f "$GITHUB_WORKSPACE"/dist/manifest.webmanifest ./manifest.webmanifest || true
          cp -f "$GITHUB_WORKSPACE"/dist/sw.js ./sw.js
          for f in "$GITHUB_WORKSPACE"/dist/workbox-*.js; do
            [ -e "$f" ] && cp -f "$f" ./
          done
          # .nojekyll برای غیرفعال‌کردن پردازش Jekyll
          cp -f "$GITHUB_WORKSPACE"/dist/.nojekyll ./.nojekyll
          # assets/ را به طور کامل جایگزین می‌کنیم
          rm -rf assets
          cp -r "$GITHUB_WORKSPACE"/dist/assets ./assets
          # آیکون‌های build را در ریشه قرار می‌دهیم (build در dist/icons دارد
          # ولی public/icons از قبل روی main هست؛ build آیکون‌ها را تغییر
          # نمی‌دهد پس overwrite بی‌ضرر است)
          cp -f "$GITHUB_WORKSPACE"/dist/icons/*.png ./icons/
          git add -f index.html manifest.webmanifest sw.js .nojekyll assets workbox-*.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(pages): deploy built output [skip ci]"
          git push origin main

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy via Actions
        id: deployment
        uses: actions/deploy-pages@v4
