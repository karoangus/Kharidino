name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production bundle
        run: PAGES_BASE=/Kharidino/ npm run build
      - run: npm test

      # الف) آماده‌سازی artifact برای استقرار Actions
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

      # ب) انتشار روی شاخه gh-pages (بدون دست‌زدن به شاخه اصلی)
      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: ghpages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      # ج) تلاش برای تغییر خودکار منبع Pages به شاخه gh-pages
      #    (اگر توکن دسترسی لازم را نداشت، کاربر یک‌بار به صورت دستی
      #    از تنظیمات Pages، Source را روی gh-pages بگذارد.)
      - name: Switch Pages source to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Current Pages config:"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | tee /tmp/pages-current.json
          echo
          echo "Switching source to gh-pages..."
          code=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "PUT -> HTTP $code"
          cat /tmp/pages-put.json 2>/dev/null; echo
          echo "Requesting Pages rebuild..."
          code=$(curl -sS -o /tmp/pages-build.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "POST builds -> HTTP $code"
          cat /tmp/pages-build.json 2>/dev/null; echo
          # اگر تغییر منبع موفق بود منتظر build شدن بمان
          echo "Waiting for Pages rebuild..."
          sleep 20 || true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy via Actions
        id: deployment
        uses: actions/deploy-pages@v4
