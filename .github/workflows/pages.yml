name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production bundle
        run: PAGES_BASE=/Kharidino/ npm run build
      - run: npm test

      # الف) استقرار از طریق Actions
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

      # ب) استقرار به شاخه gh-pages
      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      # ج) انتشار به ریشه شاخه main برای حالت legacy pages.
      # به جای overwrite مستقیم فایل‌های کاری، از یک tmp worktree استفاده
      # می‌کنیم که در آن فایل‌های dist/ در ریشه نوشته و commit می‌شوند.
      - name: Publish built output to main root (legacy Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WT=$(mktemp -d)
          git worktree add --detach "$WT" HEAD
          cd "$WT"
          # پوشه‌های build قبلی را پاک می‌کنیم
          rm -rf assets workbox-*.js sw.js manifest.webmanifest .nojekyll index.html
          # این مرحله index.html ریشه را با خروجی build جایگزین می‌کند؛
          # نسخهٔ سورس (ورودی Vite) برای ساخت بعدی در index.source.html
          # نگه داشته می‌شود تا build هرگز نشکند.
          if git show HEAD:index.html 2>/dev/null | grep -q 'src/main\.jsx'; then
            git show HEAD:index.html > index.source.html
          fi
          # کپی خروجی dist
          cp -rf "$GITHUB_WORKSPACE"/dist/. ./
          # اطمینان: .nojekyll باشد
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(pages): deploy built output [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$WT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy via Actions
        id: deployment
        uses: actions/deploy-pages@v4
