name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production bundle
        run: PAGES_BASE=/Kharidino/ npm run build
      - run: npm test

      # الف) استقرار از طریق Actions
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

      # ب) استقرار به شاخه gh-pages
      - name: Deploy to gh-pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      # ج) انتشار خروجی build روی شاخه main در ریشه (برای حالت legacy Pages)
      - name: Publish built output to main root (legacy Pages)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages-deploy \
            --branch main --depth 5
          cd /tmp/pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # کپی فایل‌های build از workspace
          cp -f "$GITHUB_WORKSPACE/dist/index.html" ./index.html
          if [ -f "$GITHUB_WORKSPACE/dist/manifest.webmanifest" ]; then
            cp -f "$GITHUB_WORKSPACE/dist/manifest.webmanifest" ./manifest.webmanifest
          fi
          cp -f "$GITHUB_WORKSPACE/dist/sw.js" ./sw.js
          find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'workbox-*.js' -exec cp -f {} ./ \;
          cp -f "$GITHUB_WORKSPACE/dist/.nojekyll" ./.nojekyll
          # assets/ را کامل جایگزین کن
          rm -rf assets
          cp -r "$GITHUB_WORKSPACE/dist/assets" ./assets
          # آیکون‌ها در dist/icons هستند؛ روی icons/ ریشه overwrite می‌شوند
          mkdir -p icons
          cp -f "$GITHUB_WORKSPACE"/dist/icons/*.png ./icons/ || true
          git add -f index.html manifest.webmanifest sw.js .nojekyll assets icons workbox-*.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(pages): deploy built output [skip ci]"
          git push origin main

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy via Actions
        id: deployment
        uses: actions/deploy-pages@v4
